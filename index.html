<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pmr-smanel-assessment</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
  (function () {
    var l =
      window.location;

    if (
      l.search.indexOf("?p=/") === 0 ||
      l.search.indexOf("&p=/") !== -1
    ) {
      var params =
        new URLSearchParams(
          l.search
        );

      var path =
        params.get("p");

      var query =
        params.get("q") || "";

      var hash =
        params.get("h") || "";

      if (path) {

        var newUrl =
          path;

        if (query) {
          newUrl +=
            query;
        }

        if (hash) {
          newUrl +=
            hash;
        }

        window.history.replaceState(
          null,
          "",
          newUrl
        );

      }

    }
  })();
</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
