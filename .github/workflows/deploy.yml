name: Deploy PMR SMANEL Assessment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build React App
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ----------------------------------------------------------
      # INSTALL
      # ----------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ----------------------------------------------------------
      # CHECK API URL
      # ----------------------------------------------------------
      #
      # Tidak menampilkan nilai URL agar log tetap bersih.
      #

      - name: Verify VITE_API_URL
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "ERROR: VITE_API_URL belum tersedia."
            exit 1
          fi

          echo "VITE_API_URL tersedia."


      # ----------------------------------------------------------
      # BUILD VITE
      # ----------------------------------------------------------

      - name: Build Vite
        run: npm run build


      # ----------------------------------------------------------
      # VERIFY BUILD OUTPUT
      # ----------------------------------------------------------

      - name: Verify dist
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          echo "Build output ditemukan."
          echo "Isi dist:"
          find dist -maxdepth 2 -type f | sort


      # ----------------------------------------------------------
      # UPLOAD PAGES ARTIFACT
      # ----------------------------------------------------------

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4